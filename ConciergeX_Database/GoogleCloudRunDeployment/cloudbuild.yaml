steps:
# Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/restaurant-search-api', '.']

# Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/restaurant-search-api']

# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'restaurant-search-api'
  - '--image'
  - 'gcr.io/$PROJECT_ID/restaurant-search-api'
  - '--region'
  - 'europe-west2'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--memory'
  - '1Gi'
  - '--cpu'
  - '1'
  - '--min-instances'
  - '0'
  - '--max-instances'
  - '10'
  - '--port'
  - '8080'
  - '--timeout'
  - '3600'
  - '--cpu-boost'
  - '--execution-environment'
  - 'gen2'
  - '--set-env-vars'
  - 'OPENAI_API_KEY=${_OPENAI_API_KEY}'
  - '--set-env-vars'
  - 'SUPABASE_URL=${_SUPABASE_URL}'
  - '--set-env-vars'
  - 'SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'
  - '--set-env-vars'
  - 'GOOGLE_PLACES_API_KEY=${_GOOGLE_PLACES_API_KEY}'

images:
- 'gcr.io/$PROJECT_ID/restaurant-search-api'

timeout: '3600s' 
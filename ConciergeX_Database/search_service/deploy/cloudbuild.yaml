steps:
# Build the container image
- name: 'gcr.io/cloud-builders/docker'
  id: 'build'
  args: ['build', '-t', 'europe-west2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/restaurant-search-api', '-f', 'ConciergeX_Database/search_service/deploy/Dockerfile', '.']

# Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  id: 'push'
  args: ['push', 'europe-west2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/restaurant-search-api']
  waitFor: ['build']

# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'deploy'
  entrypoint: 'gcloud'
  args:
    - 'run'
    - 'deploy'
    - 'restaurant-search-api'
    - '--image=europe-west2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/restaurant-search-api'
    - '--region=europe-west2'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--set-env-vars=SUPABASE_URL=${_SUPABASE_URL}'
    - '--set-env-vars=SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'
    - '--set-env-vars=SUPABASE_SERVICE_ROLE_KEY=${_SUPABASE_SERVICE_ROLE_KEY}'
    - '--set-env-vars=GOOGLE_API_KEY=${_GOOGLE_API_KEY}'
    - '--set-env-vars=OPENAI_API_KEY=${_OPENAI_API_KEY}'
  waitFor: ['push']

timeout: '1800s' 